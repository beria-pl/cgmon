name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64, single file, self-contained)
        run: |
          dotnet publish cgmon.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish\win-x64

      - name: Create zip
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish\win-x64\* -DestinationPath "cgmon-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cgmon-*.zip
          generate_release_notes: true
